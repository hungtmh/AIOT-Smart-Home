services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiot-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiot-frontend
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    depends_on:
      - backend
